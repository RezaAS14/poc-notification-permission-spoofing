<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Download PoC</title>
</head>
<body>
    <h2>Security Update</h2>
    
    <!-- 
    INTI: Arahkan ke URL dengan domain yang menyerupai 
    domain legitimate (lookalike), lalu picu download.
    
    Contoh: "goog1e.com" bukan "google.com"
    Download akan memicu net::ERR_ABORTED,
    Lookalike throttle akan PROCEED.
    -->
    
    <a href="https://github.com/RezaAS14/test/test.apk" 
       download="test.apk"
       style="display:inline-block; padding:15px 30px; background:#0066cc; color:white; text-decoration:none; border-radius:5px;">
        Download Security Update
    </a>
    
    <!-- Atau menggunakan form yang memicu download -->
    <form action="https://goog1e.com/update.apk" method="GET">
        <button type="submit">Download</button>
    </form>
    
</body>
</html>
