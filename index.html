<html>
 <head> 
  <meta charset="utf-8">
  <style>
  .button {
    background-color: #4CAF50;
    border: none;
    color: white;
    padding: 15px 32px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
    margin: 4px 2px;
    cursor: pointer;
  }
  </style>
 </head> 
 <body> 
  <script>
  function a(userInput){
    // This is a very basic example and should not be used in production
    // as it's vulnerable to XSS attacks
    var newWindow = window.open('https://google.com', 'x');
    setTimeout(function(){
      var url = 'https://github.com/RezaAS14' + userInput + '.apk';
      newWindow.location = url;
    }, 5000);
  }
  </script> 
  <center>
  <input type="text" id="userInput" placeholder="Enter your input">
  <input type="button" class="button" value="Download From Original Site" onclick="a(document.getElementById('userInput').value)">
  </center>
 </body>
</html>
