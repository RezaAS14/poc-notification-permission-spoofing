<!DOCTYPE html>
<html>
<body>
<script>
async function run() {
  // 1. replaceState agar tampilan URL "bersih"
  history.replaceState(null, "", "/");
  // 2. Masuk fullscreen segera setelah gesture
  await document.documentElement.requestFullscreen();
  // 3. pushState dengan URL lain — beberapa build memperlihatkan
  //    state lama di URL bar saat navigasi pembatalan (back) cepat
  history.pushState(null, "", "https://www.google.com/does-not-work-directly");
  // pushState cross-origin MEMANG diblokir — tes sebenarnya:
  // buka popup same-origin, dari popup memanipulasi opener.history saat dialog aktif
}
</script>
<button onclick="run()">Run</button>
</body>
</html>
