<!DOCTYPE html>
<html>
<body>
<script>
// Daftar endpoint redirect historis di properti Google yang kadang bisa
// masih open saat ini — tes satu-satu apakah benar-benar redirect eksternal
const endpoints = [
  'https://www.google.com/url?q=https://example.com',
  'https://www.google.com/url?sa=t&url=https://example.com',
  'https://www.google.com/url?ust=https://example.com&q=',
  'https://news.google.com/rss/articles/...',        // pola CVE 2024-51479 dulu masih open
  'https://accounts.google.com/Logout?continue=https://example.com',
  'https://accounts.google.com/o/oauth2/auth?redirect_uri=https://example.com&client_id=...',
  'https://support.google.com/accounts?key=%3Ahttps://example.com',
  'https://chrome.google.com/webstore/detail/.../...'
];

// Uji redirect pakai fetch no-cors + response.url
async function probe(u) {
  try {
    const r = await fetch(u, {redirect:'follow', mode:'no-cors'});
    // no-cors menyembunyikan body tapi response.type === 'opaque' tidak bisa dibaca
    // gunakan window.open + iframe onload sebagai fallback
  } catch(e){}
}

// Alternatif: buka di popup dan biarkan user menutup — redirect eksternal terlihat
endpoints.forEach(u => {
  const w = window.open(u + '&_t=' + Date.now());
  // Jika popup berakhir di example.com (bukan google.com), endpoint masih open
});
</script>
</body>
</html>
