<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Free Video Streaming — HD Player</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #eee;
         text-align: center; padding: 40px 20px; }
  .player { max-width: 640px; margin: 0 auto; background: #1c1c1c;
            padding: 20px; border-radius: 10px; }
  video { width: 100%; border-radius: 6px; background: #000; }
  button { padding: 10px 18px; margin: 10px 6px; border: none;
           border-radius: 4px; background: #e50914; color: #fff;
           cursor: pointer; font-size: 14px; }
  button.secondary { background: #444; }
  pre { text-align: left; background: #222; color: #9fd49f; padding: 10px;
        font-size: 12px; max-width: 640px; margin: 16px auto;
        white-space: pre-wrap; }
</style>
</head>
<body>
<div class="player">
  <h2>&#9654; HD Player — Now Playing</h2>
  <!-- 1-second silent audio hosted on the test asset; triggers autoplay
       eligibility so Notification.requestPermission() succeeds -->
  <video id="vid" playsinline muted poster="poster.jpg" controls>
    <source src="clip-1s.mp4" type="video/mp4">
  </video>
  <audio id="silent" src="silent-1s.mp3" preload="auto"></audio>

  <button id="playBtn">&#9654; Play Episode</button>
  <button class="secondary" onclick="registerSW()">Enable "Notifications"</button>
  <button class="secondary" onclick="askNotif()">Request Permission Now</button>
  <pre id="log">Status: idle</pre>
</div>

<script>
const log = document.getElementById('log');

/* Step 1 — silent audio/video interaction primes the user-gesture
   requirement many browsers enforce before showing permission prompts. */
document.getElementById('playBtn').addEventListener('click', () => {
  const au = document.getElementById('silent');
  au.play().then(() => {
    log.textContent = 'Status: silent audio started. Browser now treats ' +
      'this origin as user-engaged; permission prompt can be shown.';
  }).catch(e => { log.textContent = 'Status: autoplay blocked — ' + e.message; });
});

</script>
</body>
</html>
