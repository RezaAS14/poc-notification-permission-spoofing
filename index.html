<!DOCTYPE html>
<html>
<body>
<script>
// Uji 3 varian fullscreen-spoof di Chrome Android:
// apakah omnibox tetap tampil / bisa ditutupi saat fullscreen
function testFullscreenPopup() {
  // Varian A: fullscreen dari window.open (popup) — beberapa patch hanya
  // menutup fullscreen dari halaman top-level
  const w = window.open('about:blank');
  w.document.body.innerHTML = '<h1>Google Sign in (fake)</h1>';
  w.document.documentElement.requestFullscreen()
    .then(() => console.log('A: fullscreen ok dari popup'))
    .catch(e => console.log('A: blocked -', e));
}

function testFullscreenIframe() {
  // Varian B: iframe meminta fullscreen (allow="fullscreen")
  const f = document.createElement('iframe');
  f.allow = 'fullscreen';
  f.src = 'about:blank';
  document.body.appendChild(f);
  f.onload = () => {
    f.contentWindow.document.documentElement.requestFullscreen()
      .then(() => console.log('B: fullscreen ok dari iframe'))
      .catch(e => console.log('B: blocked -', e));
  };
}

function testOrientationRace() {
  // Varian C: fullscreen + orientation lock + resize race
  // — omnibox kadang tidak re-layout saat rotasi cepat
  document.documentElement.requestFullscreen()
    .then(() => screen.orientation.lock('landscape'))
    .then(() => {
      // ganti konten saat transisi rotasi
      document.title = 'https://www.google.com — Sign in';
      document.body.innerHTML = '<h1 style="font-family:sans-serif">Sign in with your Google Account</h1>';
    })
    .catch(e => console.log('C: blocked -', e));
}
testFullscreenPopup();
</script>
</body>
</html>
