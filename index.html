<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{font-family:Roboto,Arial,sans-serif;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fff}
 .logo{font-size:2.2rem;color:#4285F4;font-weight:500;margin-bottom:24px}
 .box{border:1px solid #dadce0;border-radius:8px;padding:40px;width:320px}
 input{width:100%;padding:12px;margin:12px 0;border:1px solid #dadce0;border-radius:4px;font-size:16px}
 button{background:#1a73e8;color:#fff;border:none;padding:10px 24px;border-radius:4px;float:right}
</style></head>
<body>
<div class="logo">Google</div>
<div class="box">
  <h2 style="font-weight:400">Sign in</h2>
  <p>with your Google Account</p>
  <input placeholder="Email or phone">
  <input type="password" placeholder="Password">
  <button>Next</button>
</div>
</body>
</html>
